<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SUNNO Marketplace</title>
    <meta name="description" content="Empowering Sustainable Bangladesh with eco-verified artisan products, 64-district discovery, multi-step checkout, official itemized tax receipts, transactional notifications, and live courier tracking." />
    <meta name="keywords" content="SUNNO, Bangladesh eco-friendly, organic food Bangladesh, Nakshi Kantha, Jamdani, Sundarbans honey, sustainable crafts, 64 districts Bangladesh" />
    <meta name="author" content="SUNNO Eco Marketplace" />
    <link rel="canonical" href="https://sunno.eco/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://sunno.eco/" />
    <meta property="og:title" content="SUNNO Marketplace" />
    <meta property="og:description" content="Empowering Sustainable Bangladesh with eco-verified artisan products, 64-district discovery, multi-step checkout, official itemized tax receipts, transactional notifications, and live courier tracking." />
    <meta property="og:image" content="https://images.unsplash.com/photo-1544717305-2782549b5136?auto=format&fit=crop&w=1200&q=80" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="bn_BD" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SUNNO Marketplace - Empowering Sustainable Bangladesh" />
    <meta name="twitter:description" content="Discover premium, eco-verified products crafted by local artisans across 64 districts of Bangladesh." />
    <meta name="twitter:image" content="https://images.unsplash.com/photo-1544717305-2782549b5136?auto=format&fit=crop&w=1200&q=80" />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://sunno.eco/#organization",
            "name": "SUNNO Marketplace",
            "url": "https://sunno.eco/",
            "logo": "https://images.unsplash.com/photo-1544717305-2782549b5136?auto=format&fit=crop&w=200&q=80",
            "description": "Bangladesh's Premier Multi-Vendor Eco-Friendly & Artisan Marketplace",
            "address": {
              "@type": "PostalAddress",
              "addressLocality": "Dhaka",
              "addressCountry": "BD"
            }
          },
          {
            "@type": "WebSite",
            "@id": "https://sunno.eco/#website",
            "url": "https://sunno.eco/",
            "name": "SUNNO Eco Marketplace",
            "publisher": { "@id": "https://sunno.eco/#organization" },
            "potentialAction": {
              "@type": "SearchAction",
              "target": "https://sunno.eco/#districts?search={search_term_string}",
              "query-input": "required name=search_term_string"
            }
          }
        ]
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400&family=Inter:wght@400;500;600;700&family=Montserrat:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-[#fbf9f8] text-[#1b1c1c] font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
